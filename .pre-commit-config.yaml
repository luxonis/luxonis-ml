repos:
  - repo: local
    hooks:
      - id: export-requirements
        name: Export pip compatibility requirements
        entry: tools/export_requirements.sh
        language: system
        pass_filenames: false
        # Inputs and outputs both, so hand-edits to the generated files are
        # caught as well.
        files: ^(pyproject\.toml|uv\.lock|luxonis_ml/__init__\.py|tools/export_requirements\.sh|(.*/)?requirements(-[a-z]+)?\.txt|extra_requirements/.*\.txt)$

      - id: deptry
        name: Check the declared dependencies against the imports
        # deptry reads the installed packages to map package names to
        # module names, so it runs in the project environment.
        entry: uv run --no-sync deptry .
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|(luxonis_ml|tools)/.*\.py)$

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  # Fails a function above cognitive complexity 15 and prints ranked
  # refactor plans for it. Check by hand with
  # `uv run complexipy luxonis_ml tests`.
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.1.0
    hooks:
      - id: complexipy
        args: [--suggest-refactors]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        types_or: [yaml]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3

    hooks:
      - id: taplo-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]
