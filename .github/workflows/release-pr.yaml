name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "major, minor, patch, or an explicit version such as 1.2.3"
        type: string
        default: patch

permissions:
  contents: read

jobs:
  release-pr:
    uses: ./.github/workflows/reusable-release-pr.yaml
    with:
      app-client-id: ${{ vars.ML_BOT_APP_CLIENT_ID }}
      version: ${{ inputs.version }}
      version-file: luxonis_ml/__init__.py
      project-name: LuxonisML
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ML_BOT_APP_PRIVATE_KEY }}
