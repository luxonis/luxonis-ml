name: Reusable Python Publish

# Shared by every Luxonis repository. Call it from a thin
# `Upload Python Package` workflow, as `.github/workflows/python-publish.yml`
# in this repository does.

on:
  workflow_call:
    inputs:
      uv-version:
        description: "Version of uv to build with. Empty selects the latest."
        type: string
        default: ""
      python-version:
        description: "Python version to build with"
        type: string
        default: "3.10"
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # A release build does not restore a cache, which a pull request
      # could have written.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8.1.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
