name: Release Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    uses: ./.github/workflows/reusable-release-tag.yaml
    with:
      app-client-id: ${{ vars.ML_BOT_APP_CLIENT_ID }}
      version-file: luxonis_ml/__init__.py
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ML_BOT_APP_PRIVATE_KEY }}
