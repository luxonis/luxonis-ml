name: Reusable Release Tag

# Shared by every Luxonis repository. Call it from a thin `Release Tag`
# workflow, as `.github/workflows/release-tag.yaml` in this repository does.

on:
  workflow_call:
    inputs:
      version-file:
        description: "File that holds `__version__`, such as pkg/__init__.py"
        type: string
        required: true
      tag-suffix:
        description: >-
          A tag-name convention that every Luxonis release since 2024 keeps.
          It does not mark the GitHub release as a prerelease, and it does not
          change the PyPI version. Change both deliberately, not through this
          input alone.
        type: string
        default: "-beta"
      app-client-id:
        description: "Client ID of the GitHub App whose token this workflow uses"
        type: string
        required: true
    secrets:
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          # GitHub refuses a release whose target differs from `main` in
          # `.github/workflows/` unless the token can write workflows. That
          # happens when a workflow change merges before this job runs.
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Check out the version tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: luxonis/luxonis-ml
          ref: main
          path: .release-tools
          sparse-checkout: tools/version.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the version
        id: version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          version="$(python3 .release-tools/tools/version.py --path "$VERSION_FILE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          # The default token cannot start another workflow. The app token
          # makes the release event start the publish workflows.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: v${{ steps.version.outputs.version }}${{ inputs.tag-suffix }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --generate-notes
