name: Compatibility BOM Tests

on:
  workflow_dispatch:
    inputs:
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: true
        type: string
        default: main
      train_ref:
        description: "luxonis-train version (branch/tag/SHA)"
        required: true
        type: string
        default: main
      modelconv_ref:
        description: "modelconverter version (branch/tag/SHA)"
        required: true
        type: string
        default: main
      tools_ref:
        description: "luxonis-tools version (branch/tag/SHA)"
        required: true
        type: string
        default: main
      datadreamer_ref:
        description: "datadreamer version (branch/tag/SHA)"
        required: true
        type: string
        default: main
      run_train:
        description: "Run Luxonis Train tests"
        required: false
        type: boolean
        default: true
      run_modelconv:
        description: "Run Modelconverter tests"
        required: false
        type: boolean
        default: true
      run_tools:
        description: "Run Luxonis Tools tests"
        required: false
        type: boolean
        default: true
      run_datadreamer:
        description: "Run Datadreamer tests"
        required: false
        type: boolean
        default: true

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test-luxonis-train:
    name: Test Luxonis Train
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_train) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/') &&
       github.event.pull_request.base.ref == 'main')
    # The called workflow authenticates to GCP with Workload Identity
    # Federation, so this job must allow it an OIDC token.
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: Luxonis/luxonis-train/.github/workflows/ci.yaml@1cb5e7a04c55e693b6233a5c1b05b5de5667253f
    with:
      concurrency_group: bom-${{ github.workflow }}-${{ github.ref }}
      cancel_in_progress: true
      ml_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ml_ref   || github.head_ref }}
      train_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.train_ref || 'main' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}

  test-modelconverter:
    name: Test Modelconverter
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_modelconv) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/') &&
       github.event.pull_request.base.ref == 'main')
    # The called workflow authenticates to GCP with Workload Identity
    # Federation, so this job must allow it an OIDC token.
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    uses: Luxonis/modelconverter/.github/workflows/ci.yaml@5c13d9bb3e8935d2ca1a5a288c93346f418e4c3c
    with:
      ml_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ml_ref        || github.head_ref }}
      modelconv_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.modelconv_ref || 'main' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}

  test-luxonis-tools:
    name: Test Luxonis Tools
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_tools) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/') &&
       github.event.pull_request.base.ref == 'main')
    uses: Luxonis/tools/.github/workflows/unittests.yaml@34f340a0c1025e9c793db17f6336fb9e97244b6f
    with:
      ml_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ml_ref   || github.head_ref }}
      tools_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tools_ref || 'main' }}

  test-datadreamer:
    name: Test Datadreamer
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_datadreamer) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/') &&
       github.event.pull_request.base.ref == 'main')
    uses: Luxonis/datadreamer/.github/workflows/unit-tests.yaml@2156d0d899eda304c8746c5394a70a1af8584e0f
    with:
      ml_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ml_ref           || github.head_ref }}
      datadreamer_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.datadreamer_ref || 'main' }}
