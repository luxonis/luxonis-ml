name: Update Test Durations

on:
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-durations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
      ULTRALYTICS_API_KEY: ${{ secrets.ULTRALYTICS_API_KEY }}
      LUXONISML_BUCKET: luxonis-test-bucket
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.10"
          enable-cache: true

      - name: Sync dependencies
        shell: bash
        run: |
          uv sync --locked --extra all --group dev
          uv run --no-sync pytest --help > "${RUNNER_TEMP:-.}/pytest-help.txt"
          grep -q -- '--store-durations' "${RUNNER_TEMP:-.}/pytest-help.txt"

      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_CREDENTIALS != '' }}
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Generate pytest durations
        shell: bash
        run: |
          mkdir -p .pytest-durations
          durations_path=".pytest-durations/.test_durations.${{ matrix.os }}"
          junit_xml="junit-durations-${{ matrix.os }}.xml"
          pytest_args=(
            --store-durations
            --clean-durations
            --durations-path "$durations_path"
            --junitxml "$junit_xml"
            -o junit_family=legacy
            -vv
          )

          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            uv run --no-sync pytest --cov --cov-report "xml:coverage-durations-${{ matrix.os }}.xml" "${pytest_args[@]}"
          else
            uv run --no-sync pytest "${pytest_args[@]}"
          fi

      - name: Save pytest durations cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest-durations
          key: pytest-durations-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload pytest durations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-durations-${{ matrix.os }}
          path: |
            .pytest-durations/.test_durations.${{ matrix.os }}
            junit-durations-${{ matrix.os }}.xml
            coverage-durations-${{ matrix.os }}.xml
          if-no-files-found: ignore
          retention-days: 30
