name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_ref:
        description: Ref to benchmark. Defaults to the branch this runs on.
        required: false
        type: string
      benchmark_baseline_ref:
        description: >-
          Ref to compare against. Leave empty to benchmark a single ref
          without comparing it to anything.
        required: false
        type: string
      benchmark_threshold:
        description: >-
          Percent slower a parser may get before CI fails. Two runs of
          identical code differ by up to ~12% on the fastest parsers, and
          the two refs are measured on different runners, so anything
          under ~20% is noise.
        required: false
        default: "25"
        type: string
      benchmark_scale:
        description: >-
          Multiplier for the number of images per split. Bigger datasets
          make each parse long enough that scheduling noise stops
          mattering; the default is held down by the runner rather than
          by patience, since scale 3 writes 1.7 GB across 290k files.
        required: false
        default: "2.0"
        type: string
      benchmark_repeat:
        description: Times each parse is timed.
        required: false
        default: "10"
        type: string
      benchmark_aggregate:
        description: >-
          How the repeated timings become one number. `min` is the most
          reproducible run to run, because the noise is one-sided - a
          busy runner only ever makes a parse slower.
        required: false
        default: min
        type: choice
        options:
          - min
          - mean
          - median

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-metadata.yaml

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Run pre-commit hooks
        # deptry needs the project dependencies, which this job does not
        # install. The type-check job runs it.
        env:
          SKIP: deptry
        run: >-
          uv run --locked --only-group lint prek run
          --all-files --show-diff-on-failure --color=always

  docs:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Build docs
        run: uv run --locked --only-group docs pydoctor luxonis_ml

  type-check:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Pyright check
        run: uv run --no-sync pyright --warnings --level warning --project pyproject.toml

      - name: Dependency check
        run: uv run --no-sync deptry .

  semgrep:
    needs: pre-commit
    uses: ./.github/workflows/reusable-semgrep.yaml

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [1, 2, 3, 4, 5, 6]

    needs: [type-check, semgrep, docs]
    runs-on: ${{ matrix.os }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
      ULTRALYTICS_API_KEY: ${{ secrets.ULTRALYTICS_API_KEY }}
      LUXONISML_BUCKET: luxonis-test-bucket
      GHC_ENABLED: ${{ secrets.GCP_CREDENTIALS != null }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Restore pytest durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest-durations
          key: pytest-durations-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            pytest-durations-${{ matrix.os }}-

      - name: Sync dependencies
        run: uv sync --locked

      - name: Authenticate to Google Cloud
        if: ${{ env.GHC_ENABLED }}
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Run pytest
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_GROUP: ${{ matrix.group }}
        run: |
          junit_xml="junit-$MATRIX_OS-$MATRIX_GROUP.xml"
          mkdir -p .pytest-durations
          durations_path=".pytest-durations/.test_durations.$MATRIX_OS"
          pytest_args=(
            --splits 6
            --group "$MATRIX_GROUP"
            --durations-path "$durations_path"
            --splitting-algorithm duration_based_chunks
            --junitxml "$junit_xml"
            -o junit_family=legacy
            -vv
            -n auto
            -x
          )

          if [[ "$MATRIX_OS" == "ubuntu-latest" ]]; then
            coverage_xml="coverage-$MATRIX_OS-$MATRIX_GROUP.xml"
            uv run --no-sync pytest --cov --cov-report term-missing --cov-report "xml:$coverage_xml" "${pytest_args[@]}"
          else
            uv run --no-sync pytest "${pytest_args[@]}"
          fi

      - name: Upload test result artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: junit-${{ matrix.os }}-${{ matrix.group }}
          path: junit-${{ matrix.os }}-${{ matrix.group }}.xml
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false
          files: junit-${{ matrix.os }}-${{ matrix.group }}.xml
          flags: pytest-${{ matrix.os }}
          name: pytest-${{ matrix.os }}-${{ matrix.group }}
          disable_search: true
          handle_no_reports_found: true

      - name: Upload coverage as artifact
        if: ${{ always() && matrix.os == 'ubuntu-latest'  }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.group }}
          path: coverage-${{ matrix.os }}-${{ matrix.group }}.xml
          if-no-files-found: ignore
          overwrite: true

  coverage:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      # Required by codecov-action, it builds the path-fixing file network
      # from the checked out repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-ubuntu-latest-*
          path: coverage
          merge-multiple: true

      - name: Collect coverage files
        id: coverage-files
        shell: bash
        run: |
          files=$(find coverage -type f -name 'coverage-ubuntu-latest-*.xml' | sort | paste -sd, -)
          if [[ -z "$files" ]]; then
            echo "No coverage files found" >&2
            exit 1
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ${{ steps.coverage-files.outputs.files }}
          flags: pytest-ubuntu-latest
          name: pytest-ubuntu-latest
          disable_search: true

  check-requirements:
    if: ${{ startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        submodule: ["ldf", "data", "nn_archive", "utils"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      # Only the submodule's own extra, so a dependency missing from that extra
      # fails here instead of silently working through the full dev install.
      - name: Install the package
        run: uv sync --locked --no-default-groups --extra ${{ matrix.submodule }}

      - name: Check requirements
        run: uv run --no-sync python -c 'from luxonis_ml.${{ matrix.submodule }} import *'

  # Benchmarks run on every pull request. Both refs are measured in
  # parallel and the pair finishes inside the slowest `tests` shard, so
  # they cost wall-clock time only if that shard gets faster. Telling a
  # real regression from runner noise means measuring both refs the same
  # way, which is what the matrix is for.
  benchmark-refs:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      current_ref: ${{ steps.resolve.outputs.current_ref }}
      baseline_ref: ${{ steps.resolve.outputs.baseline_ref }}
      threshold: ${{ steps.resolve.outputs.threshold }}
      scale: ${{ steps.resolve.outputs.scale }}
      repeat: ${{ steps.resolve.outputs.repeat }}
      aggregate: ${{ steps.resolve.outputs.aggregate }}

    steps:
      - name: Resolve the refs to benchmark
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.benchmark_ref }}
          INPUT_BASELINE: ${{ inputs.benchmark_baseline_ref }}
          INPUT_THRESHOLD: ${{ inputs.benchmark_threshold }}
          INPUT_SCALE: ${{ inputs.benchmark_scale }}
          INPUT_REPEAT: ${{ inputs.benchmark_repeat }}
          INPUT_AGGREGATE: ${{ inputs.benchmark_aggregate }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="${INPUT_REF:-${HEAD_REF:-$REF_NAME}}"

          # A dispatch compares only what it was asked to compare, and
          # comparing nothing is a valid answer. A release pull request
          # compares against the branch it merges into.
          if [[ "$EVENT" == 'workflow_dispatch' ]]; then
            baseline="$INPUT_BASELINE"
          else
            baseline="$BASE_REF"
          fi

          matrix=$(jq -nc \
            --arg current "$current" \
            --arg baseline "$baseline" \
            '{include: ([{role: "current", ref: $current}] + (
              if $baseline == "" then [] else
                [{role: "baseline", ref: $baseline}]
              end))}')

          {
            echo "matrix=$matrix"
            echo "current_ref=$current"
            echo "baseline_ref=$baseline"
            echo "threshold=${INPUT_THRESHOLD:-25}"
            echo "scale=${INPUT_SCALE:-2.0}"
            echo "repeat=${INPUT_REPEAT:-10}"
            echo "aggregate=${INPUT_AGGREGATE:-min}"
          } >> "$GITHUB_OUTPUT"

          echo "Benchmarking '$current' against '${baseline:-nothing}'."

  benchmarks:
    needs: benchmark-refs
    runs-on: ubuntu-latest
    # Both refs run in parallel, so this is the whole workflow's budget.
    timeout-minutes: 50

    permissions:
      contents: read

    strategy:
      # Both refs are wanted even if one of them fails, so the report can
      # say which one did.
      fail-fast: false
      matrix: ${{ fromJSON(needs.benchmark-refs.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          # This job runs pull-request-authored code and pushes nothing,
          # so the token must not stay behind in `.git/config`.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # The benchmarks build their own datasets, so they need no
      # credentials. They are timed, so they must not share the machine
      # with other test processes - no `-n auto` here.
      - name: Run parser benchmarks
        env:
          REF: ${{ matrix.ref }}
          SCALE: ${{ needs.benchmark-refs.outputs.scale }}
          REPEAT: ${{ needs.benchmark-refs.outputs.repeat }}
          AGGREGATE: ${{ needs.benchmark-refs.outputs.aggregate }}
        run: |
          # A baseline ref older than the benchmark suite has nothing to
          # measure. That is not this pull request's failure, so the leg
          # stays green and the report says there was no baseline.
          if [[ ! -d tests/test_data/parsers/benchmarks ]]; then
            echo "::notice::'$REF' has no benchmark suite, so there is nothing to measure."
            exit 0
          fi
          uv run --no-sync pytest -m benchmark tests/test_data/parsers/benchmarks \
            --benchmark-json benchmark-results.json \
            --benchmark-scale "$SCALE" \
            --benchmark-repeat "$REPEAT" \
            --benchmark-aggregate "$AGGREGATE" \
            -p no:sugar -v

      - name: Upload the benchmark results
        if: ${{ hashFiles('benchmark-results.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parser-benchmarks-${{ matrix.role }}
          path: benchmark-results.json
          if-no-files-found: error

  benchmark-report:
    needs: [benchmark-refs, benchmarks]
    if: ${{ always() && needs.benchmarks.result != 'skipped' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # The comparison tool comes from the ref under test; the baseline
      # ref may predate it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.benchmark-refs.outputs.current_ref }}
          # This job runs pull-request-authored code and pushes nothing,
          # so the token must not stay behind in `.git/config`.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # Downloaded one at a time, by name and into a named directory: a
      # `pattern` that matches a single artifact - which is what a failed
      # matrix leg leaves behind - unpacks into the workspace root
      # instead of a per-artifact directory, and every path below breaks.
      # A leg that produced nothing must not fail the report either, so
      # the report can say which ref is missing.
      - name: Download the current results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: parser-benchmarks-current
          path: parser-benchmarks-current

      - name: Download the baseline results
        continue-on-error: true
        if: ${{ needs.benchmark-refs.outputs.baseline_ref != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: parser-benchmarks-baseline
          path: parser-benchmarks-baseline

      - name: Note which results arrived
        id: results
        run: |
          for role in current baseline; do
            if [[ -f "parser-benchmarks-$role/benchmark-results.json" ]]; then
              echo "$role=true" >> "$GITHUB_OUTPUT"
            else
              echo "$role=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Compare the two refs
        id: compare
        if: ${{ steps.results.outputs.current == 'true' && steps.results.outputs.baseline == 'true' }}
        continue-on-error: true
        # Refs reach the shell as environment variables, never as `${{ }}`
        # interpolation: a pull request branch is named by whoever opened
        # it, and this job now runs for all of them.
        env:
          THRESHOLD: ${{ needs.benchmark-refs.outputs.threshold }}
          BASELINE: ${{ needs.benchmark-refs.outputs.baseline_ref }}
          CURRENT: ${{ needs.benchmark-refs.outputs.current_ref }}
        run: |
          uv run --no-sync python tools/compare_benchmarks.py \
            parser-benchmarks-baseline/benchmark-results.json \
            parser-benchmarks-current/benchmark-results.json \
            --threshold "$THRESHOLD" \
            --output report.md \
            --plain-output summary.md \
            --baseline-label "$BASELINE" \
            --current-label "$CURRENT"

      # With no baseline there is nothing to compare, so the run just
      # publishes what it measured.
      - name: Render the single-ref results
        if: ${{ steps.results.outputs.current == 'true' && steps.results.outputs.baseline != 'true' }}
        env:
          CURRENT: ${{ needs.benchmark-refs.outputs.current_ref }}
          BASELINE: ${{ needs.benchmark-refs.outputs.baseline_ref }}
        run: |
          uv run --no-sync python tools/compare_benchmarks.py render \
            parser-benchmarks-current/benchmark-results.json \
            --output report.md \
            --plain-output summary.md \
            --label "$CURRENT" \
            --baseline-label "$BASELINE"

      # A ref that measured nothing still gets a report, so the summary
      # and the comment say so rather than going blank.
      - name: Report the missing measurements
        if: ${{ steps.results.outputs.current != 'true' }}
        env:
          CURRENT: ${{ needs.benchmark-refs.outputs.current_ref }}
        run: |
          {
            echo '### Parser benchmarks'
            echo
            echo "No results for \`$CURRENT\` - the benchmark job did not"
            echo 'finish. See the run log.'
          } | tee report.md > summary.md

      # The summary gets the plain report: a job summary renders neither
      # math nor colour, and would print the markup itself.
      - name: Publish the results to the job summary
        if: ${{ always() }}
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Kept as a single edited comment rather than one per run, so a
      # pull request that benchmarks on every push stays readable. Never
      # worth failing the job over: a pull request from a fork gets a
      # read-only token and cannot comment at all.
      - name: Comment the results on the pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- parser-benchmarks -->'
            cat report.md
          } > comment.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- parser-benchmarks -->")) | .id' \
            | head -n 1)
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@comment.md
          else
            gh pr comment "$PR" --repo "$REPO" --body-file comment.md
          fi

      - name: Fail on a regression
        if: ${{ steps.compare.outcome == 'failure' }}
        run: |
          echo 'The benchmark comparison failed: either a parser regressed by'
          echo 'more than the configured threshold, or the two reports had no'
          echo 'dataset type in common. The report above says which.'
          exit 1
