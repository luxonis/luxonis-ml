name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-assigner:
    runs-on: ubuntu-latest

    steps:
      - name: Auto-assign
        uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a

  labeler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          configuration-path: .github/labeler.yaml

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Run pre-commit hooks
        run: >-
          uv run --locked --only-group lint prek run
          --all-files --show-diff-on-failure --color=always

  docs:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Build docs
        run: uv run --locked --only-group docs pydoctor luxonis_ml

  type-check:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Pyright check
        run: uv run --no-sync pyright --warnings --level warning --project pyproject.toml

  semgrep:
    needs: pre-commit
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Perform Semgrep Analysis
        run: semgrep scan -q --sarif --config auto --config "p/secrets" . > semgrep-results.sarif

      - name: Pretty-Print SARIF Output
        run: |
          jq . semgrep-results.sarif > formatted-semgrep-results.sarif || echo "{}"
          echo "Formatted SARIF Output (First 20 lines):"
          head -n 20 formatted-semgrep-results.sarif || echo "{}"

      - name: Validate JSON Output
        run: |
          if ! jq empty formatted-semgrep-results.sarif > /dev/null 2>&1; then
            echo "⚠️ Semgrep output is not valid JSON. Skipping annotations."
            exit 0
          fi

      - name: Add PR Annotations for Semgrep Findings
        run: |
          total_issues=$(jq '.runs[0].results | length' formatted-semgrep-results.sarif)
          if [[ "$total_issues" -eq 0 ]]; then
            echo "✅ No Semgrep issues found!"
            exit 0
          fi

          jq -c '.runs[0].results[]' formatted-semgrep-results.sarif | while IFS= read -r issue; do
            file=$(echo "$issue" | jq -r '.locations[0].physicalLocation.artifactLocation.uri')
            line=$(echo "$issue" | jq -r '.locations[0].physicalLocation.region.startLine')
            message=$(echo "$issue" | jq -r '.message.text')

            if [[ -n "$file" && -n "$line" && -n "$message" ]]; then
              echo "::error file=$file,line=$line,title=Semgrep Issue::${message}"
            fi
          done

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [1, 2, 3, 4, 5, 6]

    needs: [type-check, semgrep, docs]
    runs-on: ${{ matrix.os }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
      ULTRALYTICS_API_KEY: ${{ secrets.ULTRALYTICS_API_KEY }}
      LUXONISML_BUCKET: luxonis-test-bucket
      GHC_ENABLED: ${{ secrets.GCP_CREDENTIALS != null }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Restore pytest durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest-durations
          key: pytest-durations-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            pytest-durations-${{ matrix.os }}-

      - name: Sync dependencies
        run: uv sync --locked

      - name: Authenticate to Google Cloud
        if: ${{ env.GHC_ENABLED }}
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Run pytest
        shell: bash
        run: |
          junit_xml="junit-${{ matrix.os }}-${{ matrix.group }}.xml"
          mkdir -p .pytest-durations
          durations_path=".pytest-durations/.test_durations.${{ matrix.os }}"
          pytest_args=(
            --splits 6
            --group "${{ matrix.group }}"
            --durations-path "$durations_path"
            --splitting-algorithm duration_based_chunks
            --junitxml "$junit_xml"
            -o junit_family=legacy
            -vv
            -n auto
            -x
          )

          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            coverage_xml="coverage-${{ matrix.os }}-${{ matrix.group }}.xml"
            uv run --no-sync pytest --cov --cov-report term-missing --cov-report "xml:$coverage_xml" "${pytest_args[@]}"
          else
            uv run --no-sync pytest "${pytest_args[@]}"
          fi

      - name: Upload test result artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: junit-${{ matrix.os }}-${{ matrix.group }}
          path: junit-${{ matrix.os }}-${{ matrix.group }}.xml
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          fail_ci_if_error: false
          files: junit-${{ matrix.os }}-${{ matrix.group }}.xml
          flags: pytest-${{ matrix.os }}
          name: pytest-${{ matrix.os }}-${{ matrix.group }}
          disable_search: true
          handle_no_reports_found: true

      - name: Upload coverage as artifact
        if: ${{ always() && matrix.os == 'ubuntu-latest'  }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.group }}
          path: coverage-${{ matrix.os }}-${{ matrix.group }}.xml
          if-no-files-found: ignore
          overwrite: true

  coverage:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      # Required by codecov-action, it builds the path-fixing file network
      # from the checked out repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-ubuntu-latest-*
          path: coverage
          merge-multiple: true

      - name: Collect coverage files
        id: coverage-files
        shell: bash
        run: |
          files=$(find coverage -type f -name 'coverage-ubuntu-latest-*.xml' | sort | paste -sd, -)
          if [[ -z "$files" ]]; then
            echo "No coverage files found" >&2
            exit 1
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ${{ steps.coverage-files.outputs.files }}
          flags: pytest-ubuntu-latest
          name: pytest-ubuntu-latest
          disable_search: true

  check-requirements:
    if: ${{ startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        submodule: ["ldf", "data", "nn_archive", "utils"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      # Only the submodule's own extra, so a dependency missing from that extra
      # fails here instead of silently working through the full dev install.
      - name: Install the package
        run: uv sync --locked --no-default-groups --extra ${{ matrix.submodule }}

      - name: Check requirements
        run: uv run --no-sync python -c 'from luxonis_ml.${{ matrix.submodule }} import *'
