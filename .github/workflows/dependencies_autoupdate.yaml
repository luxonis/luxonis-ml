name: Python Dependencies Updater

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-python-dependencies:
    uses: ./.github/workflows/reusable-dependencies-update.yaml
    with:
      app-client-id: ${{ vars.ML_BOT_APP_CLIENT_ID }}
      export-script: tools/export_requirements.sh
      uv-version: "0.13.9"
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ML_BOT_APP_PRIVATE_KEY }}
