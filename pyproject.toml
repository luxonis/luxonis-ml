[project]
name = "luxonis-ml"
description = "MLOps tools for training models for Luxonis devices"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
license = "Apache-2.0"
authors = [{ name = "Luxonis", email = "support@luxonis.com" }]
maintainers = [{ name = "Luxonis", email = "support@luxonis.com" }]
keywords = ["ml", "ops", "camera", "luxonis", "oak"]
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "PyYAML~=6.0",
  "cyclopts~=4.16",
  "fsspec==2024.6.1",
  "loguru~=0.7",
  "pydantic-extra-types~=2.10",
  "pydantic-settings~=2.1",
  "pydantic~=2.7",
  "rich~=15.0",
  "semver~=3.0",
  "typeguard~=4.1",
  "typing-extensions>=4.13",
]

[project.optional-dependencies]
ldf = ["numpy~=2.2", "pillow>=10.0", "pycocotools~=2.0"]
data = [
  "luxonis-ml[ldf]",
  "albumentations>=2.0.0",
  "bidict~=0.21",
  "defusedxml~=0.7",
  "filelock~=3.0",
  "gdown~=6.1",
  "matplotlib~=3.10",
  "numpy~=2.2",
  "opencv-python~=4.10",
  "pillow-heif~=1.5",
  "polars[timezone]~=1.43",
  "pyarrow~=23.0",
  "pycocotools~=2.0",
  "requests~=2.32",
]
telemetry = ["posthog~=7.29"]
tracker = ["numpy~=2.2", "unique-names-generator~=1.0"]
# Public install targets whose dependencies are already in the base package.
nn_archive = []
utils = []

gcs = ["gcsfs==2024.6.1"]
mlflow = ["mlflow~=3.1"]
roboflow = ["roboflow~=1.4"]
s3 = ["s3fs==2024.6.1"]

all = [
  "luxonis-ml[data,gcs,ldf,mlflow,nn_archive,roboflow,s3,telemetry,tracker,utils]",
]

[dependency-groups]
lint = ["prek~=0.4"]
docs = ["pydoctor~=25.10"]
dev = [
  { include-group = "lint" },
  { include-group = "docs" },
  "luxonis-ml[all]",
  "hypothesis~=6.161",
  "onnx~=1.22",
  "pyright~=1.1",
  "pytest-clarity~=1.0",
  "pytest-cov~=7.1",
  "pytest-dependency~=0.6",
  "pytest-split~=0.11",
  "pytest-subtests~=0.15",
  "pytest-xdist~=3.8",
]

[project.scripts]
luxonis_ml = "luxonis_ml.__main__:app"

[project.urls]
repository = "https://github.com/luxonis/luxonis-ml"
issues = "https://github.com/luxonis/luxonis-ml/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["luxonis_ml*"]

[tool.setuptools.dynamic]
version = { attr = "luxonis_ml.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 79
indent-width = 4

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ANN",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FLY",
  "FURB",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "NPY",
  "PERF101",
  "PERF102",
  "PERF402",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ANN002",
  "ANN003",
  "ANN204",
  "ANN401",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D202",
  "D203",
  "D205",
  "D212",
  "D213",
  "E501",
  "ICN002",
  "NPY002",
  "PLC0415",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PLW2901",
  "PTH123",
  "PYI051",
  "RET503",
  "RUF012",
  "S101",
  "S311",
  "S603",
  "SIM108",
  "TRY003",
  "W191",
]
unfixable = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]
"__main__.py" = ["ANN201"]
"tools/benchmark.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__".msg = "Do not use imports from __future__."

[tool.docformatter]
black = true
style = "google"
wrap-summaries = 72
wrap-descriptions = 72

[tool.pyright]
# `TypeForm` (PEP 747) names the type expression a pydantic
# `__get_pydantic_core_schema__` hook receives. The PEP is not final, so
# pyright reads the annotation only with this on.
enableExperimentalFeatures = true
pythonVersion = "3.10"
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  "build",
  "dist",
  "luxonis_ml/tracker",
  "examples",
  "__main__.py",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "none"
reportIncompatibleVariableOverride = "none"
reportIncompatibleMethodOverride = "none"
reportUnnecessaryIsInstance = "none"

[tool.pytest]
doctest_optionflags = [
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "NUMBER",
]
testpaths = ["tests", "luxonis_ml"]
addopts = ["--disable-warnings", "--doctest-modules"]

[tool.coverage.run]
omit = ["luxonis_ml/utils/logging.py", "luxonis_ml/tracker/*", "**/__main__.py"]
source = ["luxonis_ml", "tests"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "def __rich_repr__",
  "def __str__",
  "assert",
  "raise AssertionError",
  "raise NotImplementedError",
  "except ImportError",
  "@abstractmethod",
  "@overload",
  "(sys\\.)?exit\\(",
  "exit\\(",
  "cv2\\.imshow",
  "cv2\\.waitKey",
  "logger\\.",
  "pytest\\.skip",
]
